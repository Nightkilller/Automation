name: Daily Tech Carousel Generator

on:
  schedule:
    # Runs daily at 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write # Required to commit and push history.json changes

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chromium dependencies
        # Ubuntu runners usually have Chrome dependencies, but we install libgbm and run Puppeteer's browser installer
        # to ensure Chromium has all required runtime shared libraries.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm1
          npx puppeteer browsers install chrome

      - name: Run CarouselForge pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          IG_HANDLE: ${{ secrets.IG_HANDLE }}
        run: node src/index.js

      - name: Commit and push history.json changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add history.json
          # Check if there are changes to commit, otherwise do nothing
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes in history.json to commit."
          else
            git commit -m "chore: update daily topic history [skip ci]"
            git push
          fi
